# ==============================================================================
# 🌐 CONFIGURACIÓN OFICIAL VIRTUALHOST APACHE2: laravel.conf (S.O.N.A.R.)
# Soporte Unificado: HTTP (:80), HTTPS (:443), noVNC WebSocket y WebSSH
# Ubicación Canónica: /opt/sonar/system/templates/apache2/laravel.conf
# ==============================================================================

<VirtualHost *:80>
    ServerAdmin admin@monitoreo-vs.local
    ServerName monitoreo-vs.local
    ServerAlias localhost 127.0.0.1 *
    DocumentRoot /opt/sonar/web_portal/public

    <Directory />
        Options FollowSymLinks
        AllowOverride None
    </Directory>
    <Directory /opt/sonar/web_portal/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy WebSocket hacia Websockify para noVNC
    ProxyPreserveHost On
    ProxyPass /novnc/websockify ws://127.0.0.1:6080/websockify retry=0 timeout=3600
    ProxyPassReverse /novnc/websockify ws://127.0.0.1:6080/websockify
    ProxyPass /websockify ws://127.0.0.1:6080/websockify retry=0 timeout=3600
    ProxyPassReverse /websockify ws://127.0.0.1:6080/websockify

    # Proxy WebSSH hacia servicio de Terminal SSH local
    ProxyPass /wssh/ws ws://127.0.0.1:6082/ws retry=0 timeout=3600
    ProxyPassReverse /wssh/ws ws://127.0.0.1:6082/ws
    ProxyPass /wssh/ http://127.0.0.1:6082/ retry=0 timeout=3600
    ProxyPassReverse /wssh/ http://127.0.0.1:6082/
    ProxyPass /wssh http://127.0.0.1:6082/ retry=0 timeout=3600
    ProxyPassReverse /wssh http://127.0.0.1:6082/

    # Soporte noVNC HTML5 estático
    Alias /novnc /usr/share/novnc
    <Directory /usr/share/novnc>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/laravel_error.log
    CustomLog ${APACHE_LOG_DIR}/laravel_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin admin@monitoreo-vs.local
    ServerName monitoreo-vs.local
    ServerAlias 192.168.1.220 localhost 127.0.0.1 *
    DocumentRoot /opt/sonar/web_portal/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/monitoreo-vs.crt
    SSLCertificateKeyFile /etc/ssl/private/monitoreo-vs.key

    <Directory />
        Options FollowSymLinks
        AllowOverride None
    </Directory>
    <Directory /opt/sonar/web_portal/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy WebSocket hacia Websockify para noVNC
    ProxyPreserveHost On
    ProxyPass /novnc/websockify ws://127.0.0.1:6080/websockify retry=0 timeout=3600
    ProxyPassReverse /novnc/websockify ws://127.0.0.1:6080/websockify
    ProxyPass /websockify ws://127.0.0.1:6080/websockify retry=0 timeout=3600
    ProxyPassReverse /websockify ws://127.0.0.1:6080/websockify

    # Proxy WebSSH hacia servicio de Terminal SSH local
    ProxyPass /wssh/ws ws://127.0.0.1:6082/ws retry=0 timeout=3600
    ProxyPassReverse /wssh/ws ws://127.0.0.1:6082/ws
    ProxyPass /wssh/ http://127.0.0.1:6082/ retry=0 timeout=3600
    ProxyPassReverse /wssh/ http://127.0.0.1:6082/
    ProxyPass /wssh http://127.0.0.1:6082/ retry=0 timeout=3600
    ProxyPassReverse /wssh http://127.0.0.1:6082/

    # Soporte noVNC HTML5 estático
    Alias /novnc /usr/share/novnc
    <Directory /usr/share/novnc>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/laravel_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/laravel_ssl_access.log combined
</VirtualHost>
